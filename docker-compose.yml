services:
  postgres:
    # Keep the major version in sync with the Supabase project (hosted Supabase runs Postgres 17).
    image: postgres:17-alpine
    container_name: ai-interviewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interviewer
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_interviewer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
