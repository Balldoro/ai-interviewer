name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, format, typecheck, test & build
    runs-on: ubuntu-latest
    env:
      # env.ts validates this at build time; CI never connects to the database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_interviewer
    steps:
      - uses: actions/checkout@v6

      # Version is read from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Read from `engines.node` in package.json, which also sets the Node version on Vercel.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
